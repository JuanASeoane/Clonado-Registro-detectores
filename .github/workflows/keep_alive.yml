name: Mantener Streamlit Despierto

on:
  schedule:
    # Se ejecuta de forma automática cada 8 horas (a las 00:00, 08:00 y 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Hacer un cambio fantasma en el código
        run: |
          date > ping.txt

      - name: Subir el cambio a GitHub
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add ping.txt
          git commit -m "Auto-ping para mantener Streamlit despierto [skip ci]" || echo "No hay cambios para subir"
          git push
